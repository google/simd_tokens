name: Test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false  # Complete all tests on failure so we can tell if it's arch-specific.
      matrix:
        # x86_64 and aarch64: the crate has separate token/feature sets per arch.
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - run: cargo test --workspace --locked
    - name: no_std build
      run: cargo build -p simd_tokens --no-default-features --locked

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - run: rustup component add clippy rustfmt
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --all-targets --locked
    - run: cargo doc --workspace --no-deps --locked
      env:
        RUSTDOCFLAGS: -D warnings
