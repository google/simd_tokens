name: Test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false  # Complete all tests on failure so we can tell if it's arch-specific.
      matrix:
        # x86_64 and aarch64: the crate has separate token/feature sets per arch.
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - run: cargo test --workspace --locked
      env:
        # Allow diagnostic wording drift across rustc releases; a test that
        # unexpectedly compiles still fails here, and the next step warns on
        # snapshot diffs (and fails on missing snapshots).
        TRYBUILD: overwrite
    - name: Check compile-fail snapshots
      run: |
        if [ -n "$(git ls-files --others --exclude-standard -- simd_tokens/tests/build_tests/)" ]; then
          echo "::error::Missing .stderr snapshot(s) for compile-fail test(s):"
          git ls-files --others --exclude-standard -- simd_tokens/tests/build_tests/
          exit 1
        fi
        if ! git diff --quiet -- simd_tokens/tests/build_tests/; then
          echo "::warning::Compile-fail .stderr snapshots differ from current rustc output."
          git diff -- simd_tokens/tests/build_tests/
        fi
    - name: no_std build
      run: cargo build -p simd_tokens --no-default-features --locked

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - run: rustup component add clippy rustfmt
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --all-targets --locked
    - run: cargo doc --workspace --no-deps --locked
      env:
        RUSTDOCFLAGS: -D warnings
